syntax = "proto3";
package termusic.player;

import "common.proto";

// Everything directly related to playback control.
service PlayerControl {
  // Player Commands
  // Change the running state (Play/Pause)
  rpc ChangeRunningState(ChangeRunningStateRequest) returns (PlayState);
  // Skip to the next track
  rpc SkipNext(common.Empty) returns (common.Empty);
  // Skip to the previous track
  rpc SkipPrevious(common.Empty) returns (common.Empty);
  // Get the current Track progress once (use stream for continuous usage)
  rpc GetProgress(common.Empty) returns (GetProgressResponse);
  // Change the volume
  rpc ChangeVolume(ChangeVolumeRequest) returns (VolumeReply);
  // Change the speed
  rpc ChangeSpeed(ChangeSpeedRequest) returns (SpeedReply);
  // Toggle the gapless mode, returns the new state.
  rpc ToggleGapless(common.Empty) returns (GaplessState);
  // Seek to a specific point
  // Note that this request does not wait until the seek has finished executing!
  rpc Seek(SeekRequest) returns (common.Empty);
}

message ChangeRunningStateRequest {
  // 0 = toggle
  // 1 = pause
  // 2 = resume
  uint32 state = 1;
}

message ChangeVolumeRequest {
  oneof type {
    // Change in steps
    // Positive increases the volume
    // Negative decreases the volume
    // Only i16 is actually supported
    int32 step = 1;
    // Change in specific units
    // Only i16 is actually supported
    int32 volume = 2;
  }
}

message ChangeSpeedRequest {
  oneof type {
    // Change in steps
    // Positive increases the speed
    // Negative decreases the speed
    int32 step = 1;
    // Change in specific units
    int32 speed = 2;
    // Reset speed to normal
    common.Empty reset = 3;
  }
}

message SeekRequest {
  oneof type {
    // Change in steps
    // Positive seeks forward
    // Negative seeks backwards
    int32 step = 1;
    // Seek relatively in seconds
    int64 time = 3;
    // Seek to the beginning of the current track, effectively restarting it
    common.Empty restart_track = 2;
  }
}

message GetProgressResponse {
  PlayerTime progress = 1;
  uint64 current_track_index = 3;
  uint32 status = 4;
  // actually a u16, but protobuf does not support types lower than 32 bits
  uint32 volume = 5;
  int32 speed = 6;
  bool gapless = 7;
  string radio_title = 9;
}

// A play status.
message PlayState {
  // The actual status, mapped to [`playback::playlist::Status`]
  uint32 status = 1;
}

message PlayerTime {
  common.Duration position = 1;
  // TODO: likely also should be possible to be optional
  common.Duration total_duration = 2;
}

message VolumeReply {
  // actually a u16, but protobuf does not support types lower than 32 bits
  uint32 volume = 1;
}

message SpeedReply {
  // The current speed
  int32 speed = 1;
}

// A Gapless state.
message GaplessState {
  // The current gapless state
  bool gapless = 1;
}
