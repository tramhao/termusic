syntax = "proto3";
package termusic.player;

import "common.proto";

// Everything directly related to playback control.
service PlayerControl {
  // Player Commands
  // Toggle Pause/Play, returns the new state
  rpc TogglePause(common.Empty) returns (PlayState);
  rpc SkipNext(common.Empty) returns (common.Empty);
  rpc SkipPrevious(common.Empty) returns (common.Empty);
  rpc GetProgress(common.Empty) returns (GetProgressResponse);
  rpc VolumeUp(common.Empty) returns (VolumeReply);
  rpc VolumeDown(common.Empty) returns (VolumeReply);
  rpc SpeedUp(common.Empty) returns (SpeedReply);
  rpc SpeedDown(common.Empty) returns (SpeedReply);
  // Toggle the gapless mdoe, returns the new state.
  rpc ToggleGapless(common.Empty) returns (GaplessState);
  rpc RestartTrack(common.Empty) returns (PlayerTime);
  rpc SeekForward(common.Empty) returns (PlayerTime);
  rpc SeekBackward(common.Empty) returns (PlayerTime);

  // Playlist Commands
  // Skip to a specific track in the playlist
  // at the momemnt, the one set via "current_track_index"
  rpc PlaySpecific(PlaylistPlaySpecific) returns (common.Empty);
  // Cycle the playlist loop mode, returns the new mode.
  rpc CycleLoop(common.Empty) returns (PlaylistLoopMode);
  // Add one or multiple tracks to the playlist
  rpc AddToPlaylist(PlaylistTracksToAdd) returns (common.Empty);
  // Remove one or multiple tracks from the playlist
  rpc RemoveFromPlaylist(PlaylistTracksToRemove) returns (common.Empty);
  // Swap some tracks.
  rpc SwapTracks(PlaylistSwapTracksRequest) returns (common.Empty);
  // Get all tracks of the playlist.
  rpc GetPlaylist(common.Empty) returns (PlaylistTracks);
  // Shuffle the playlist, returns the new playlist tracks.
  rpc ShufflePlaylist(common.Empty) returns (common.Empty);
  // Sort the playlist by criterion and direction, emits PlaylistShuffled event.
  rpc SortPlaylist(SortPlaylistRequest) returns (common.Empty);
  // Check for and remove deleted items from the playlist.
  // Unlike shuffle, this will send Removal events
  rpc RemoveDeletedTracks(common.Empty) returns (common.Empty);
}

// A play status.
message PlayState {
  // The actual status, mapped to [`playback::playlist::Status`]
  uint32 status = 1;
}

message PlayerTime {
  common.Duration position = 1;
  // TODO: likely also should be possible to be optional
  common.Duration total_duration = 2;
}

message GetProgressResponse {
  PlayerTime progress = 1;
  uint64 current_track_index = 3;
  uint32 status = 4;
  // actually a u16, but protobuf does not support types lower than 32 bits
  uint32 volume = 5;
  int32 speed = 6;
  bool gapless = 7;
  string radio_title = 9;
}

message VolumeReply {
  // actually a u16, but protobuf does not support types lower than 32 bits
  uint32 volume = 1;
}

message SpeedReply {
  int32 speed = 1;
}

// A Gapless state.
message GaplessState {
  bool gapless = 1;
}

// Play a specific track in the playlist
message PlaylistPlaySpecific {
  uint64 track_index = 1;

  common.TrackId id = 2;
}

// All tracks in the current playlist, they *should* be ordered from lowest to highest index.
message PlaylistTracks {
  uint64 current_track_index = 1;
  repeated PlaylistTrack tracks = 2;
}

// A Track got added to the playlist, this message contains where it was added and all the metadata required for display.
message PlaylistTrack {
  // The index the track was added to the playlist.
  // If this is not at the end, all tracks at that index and after need to be shifted to make place for this new one.
  uint64 at_index = 1;

  // The Id of the track that was added
  common.TrackId id = 4;
}

// The current Loop mode for the playlist
message PlaylistLoopMode {
  // The actual mode, mapped to [`config::v2::server::LoopMode`]
  uint32 mode = 1;
}

// Some track needs to be swapped.
message PlaylistSwapTracksRequest {
  // The first index to swap
  uint64 index_a = 1;
  // The second index to swap
  uint64 index_b = 2;
}

// Add multiple tracks to a Playlist
message PlaylistTracksToAdd {
  // The index the track(s) are added at.
  // If this is not at the end, all tracks at that index and after need to be shifted to make place for this new one.
  uint64 at_index = 1;

  // All the Tracks to add at the index
  repeated common.TrackId tracks = 2;
}

// Remove multiple track or clear the playlist
message PlaylistTracksToRemove {
  oneof type {
    PlaylistTracksToRemoveIndexed indexed = 1;
    PlaylistTracksToRemoveClear clear = 2;
  }
}

// Remove multiple tracks from a playlist
message PlaylistTracksToRemoveIndexed {
  // The index the track(s) that are removed
  // This is the starting index, and x amount of elements are removed after
  uint64 at_index = 1;

  // All the Tracks to remove at the index
  repeated common.TrackId tracks = 2;
}

/// Clear the entire playlist
message PlaylistTracksToRemoveClear {
  // common.Empty as there are no values, but not using "common.Empty" to have a unique message id
}

// A request to sort the Playlist.
message SortPlaylistRequest {
  SortCriterion criterion = 1;
  SortDirection direction = 2;
}

// All the sort methods available.
enum SortCriterion {
  ALPHANUMERIC = 0;
  FIRST_ADDED = 1;
  DURATION = 2;
  MOST_PLAYED = 3;
  RECENCY = 4;
  FRECENCY = 5;
}

// All the orderings a sort can take.
enum SortDirection {
  ASC = 0;
  DESC = 1;
}
