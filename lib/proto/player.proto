syntax = "proto3";
package termusic.player;

import "common.proto";

// Everything directly related to playback control.
service PlayerControl {
  // Player Commands
  // Toggle Pause/Play, returns the new state
  rpc TogglePause(common.Empty) returns (PlayState);
  // Skip to the next track
  rpc SkipNext(common.Empty) returns (common.Empty);
  // Skip to the previous track
  rpc SkipPrevious(common.Empty) returns (common.Empty);
  // Get the current Track progress once (use stream for continuous usage)
  rpc GetProgress(common.Empty) returns (GetProgressResponse);
  // Change the volume one step up
  rpc VolumeUp(common.Empty) returns (VolumeReply);
  // Change the volume one step down
  rpc VolumeDown(common.Empty) returns (VolumeReply);
  // Change the speed one step up
  rpc SpeedUp(common.Empty) returns (SpeedReply);
  // Change the speed one step down
  rpc SpeedDown(common.Empty) returns (SpeedReply);
  // Toggle the gapless mode, returns the new state.
  rpc ToggleGapless(common.Empty) returns (GaplessState);
  // Restart the current track
  // Note that this is a seek and this request does not wait until the seek is done
  rpc RestartTrack(common.Empty) returns (PlayerTime);
  // Seek one step forward
  // Note that this request does not wait until the seek is done
  rpc SeekForward(common.Empty) returns (PlayerTime);
  // Seek one step backward
  // Note that this request does not wait until the seek is done
  rpc SeekBackward(common.Empty) returns (PlayerTime);
}

// A play status.
message PlayState {
  // The actual status, mapped to [`playback::playlist::Status`]
  uint32 status = 1;
}

message PlayerTime {
  common.Duration position = 1;
  // TODO: likely also should be possible to be optional
  common.Duration total_duration = 2;
}

message GetProgressResponse {
  PlayerTime progress = 1;
  uint64 current_track_index = 3;
  uint32 status = 4;
  // actually a u16, but protobuf does not support types lower than 32 bits
  uint32 volume = 5;
  int32 speed = 6;
  bool gapless = 7;
  string radio_title = 9;
}

message VolumeReply {
  // actually a u16, but protobuf does not support types lower than 32 bits
  uint32 volume = 1;
}

message SpeedReply {
  // The current speed
  int32 speed = 1;
}

// A Gapless state.
message GaplessState {
  // The current gapless state
  bool gapless = 1;
}
